<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Ashish Sharma</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c0a02'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='monospace' font-weight='bold' fill='white'>A</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #edeef0; font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 48px 40px;
    text-align: center; max-width: 420px; width: 100%;
    box-shadow: 0 4px 40px rgba(0,0,0,0.08);
  }
  .code {
    font-size: 96px; font-weight: 800; color: #7c0a02;
    font-family: 'Poppins', sans-serif; line-height: 1;
    margin-bottom: 16px;
  }
  h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
  p  { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 28px; }
  a  {
    display: inline-flex; align-items: center; gap: 8px;
    background: #7c0a02; color: #fff; text-decoration: none;
    padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
    transition: background 0.2s;
  }
  a:hover { background: #c41b0f; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
