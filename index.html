    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c0a02'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='monospace' font-weight='bold' fill='white'>A</text></svg>">

    <!-- ── Theme color (browser chrome on mobile) ── -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #edeef0; font-family: 'Inter', sans-serif;
      padding: 12px; -webkit-overflow-scrolling: touch; overflow-x: hidden;
      scroll-behavior: smooth;
    }
    img { max-width: 100%; height: auto; vertical-align: middle; display: inline-block; }

    /* ── GRID ── */
    .grid-wrapper {
      display: grid; gap: 16px;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 300px; grid-auto-flow: dense;
    }
    .grid-wrapper > div { display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    .grid-wrapper > div > img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
    .grid-wrapper .big-2 { grid-column: span 4; grid-row: span 2; align-items: center; overflow-y: auto; }
    .grid-wrapper .wide  { grid-column: span 2; }
    .grid-wrapper .wide2 { grid-column: span 2; }
    .grid-wrapper .tall  { grid-row: span 2; }
    .grid-wrapper .big   { grid-column: span 2; grid-row: span 2; }
    .grid-wrapper .slim  { grid-column: span 4; min-height: 160px; }

    /* ── ADMIN & RESUME BUTTONS ── */
    /* Admin trigger — completely invisible. 5 taps reveal admin login. */
    .admin-trigger {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      background: transparent; border: none;
      border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: default; text-decoration: none; outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .admin-trigger:hover { background: transparent; transform: none; }
    .admin-trigger i { display: none; } /* icon hidden */
    .resume-btn {
      position: absolute; bottom: 18px; left: 16px; right: 16px; z-index: 10;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; padding: 9px 14px;
      display: none; align-items: center; justify-content: center; gap: 8px;
      color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      text-decoration: none; backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.1s; font-family: inherit;
    }
    .resume-btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

    /* ── CONTENT ── */
    /* ── CONTENT ── */
    .content {
      position: absolute; padding: 28px;
      display: flex; flex-direction: column; justify-content: flex-start; text-align: left;
      top: 0; left: 0; right: 0;
    }
    /* Inside .box, content is relative (not absolute) so the box sizes from text height */
    .grid-wrapper .box { min-height: 180px; align-items: center; justify-content: center; }
    .grid-wrapper .box .content {
      position: relative; top: auto; left: auto; right: auto; width: 100%;
      align-self: flex-start;
    }
    .content h2 { font-family: 'Poppins', sans-serif; font-weight: 700; margin: 0 0 8px; font-size: 1.9rem; color: #333; }
    .content p  { font-family: 'Poppins', sans-serif; font-weight: 500; margin: 0; font-size: 0.95rem; line-height: 1.6; color: #555; }

    /* ── SOCIAL ── */
    .social-icons { display: grid; grid-template-columns: repeat(2,1fr); gap: 32px; padding: 32px; text-align: center; }
    .social-icons a { font-size: 36px; color: #000; text-decoration: none; transition: transform 0.3s, color 0.3s; }
    .social-icons a:hover { color: #7c0a02; transform: scale(1.1); }
    .social-icons-2 { display: flex; justify-content: center; align-items: center; gap: 50px; padding: 16px 28px 24px; text-align: center; max-width: 320px; margin: 0 auto; }
    .social-icons-2 a { font-size: 32px; color: #000; text-decoration: none; transition: transform 0.3s, color 0.3s; flex-shrink: 0; }
    .social-icons-2 a:hover { color: #7c0a02; transform: scale(1.1); }
    .social-section { text-align: center; padding: 24px 20px; width: 100%; }
    .social-heading { font-size: 20px; color: #000; margin-bottom: 14px; }

    /* ── SLIDER ── */
    .slider-wrapper { position: relative; width: 100%; height: 100%; }
    .slider-container {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      border-radius: 15px; background: #f5f5f5;
      touch-action: pan-y pinch-zoom;
    }
    .slider-track { display: flex; transition: transform 0.5s ease; height: 100%; }
    /* Slide fills the container — image never dictates the card height */
    .slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; min-height: inherit; }
    .slide img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .slide-overlay {
      position: absolute; top: 24px; left: 24px; max-width: 280px;
      padding: 16px 12px; pointer-events: none; z-index: 3;
      background: none; border-radius: 0; backdrop-filter: none;
    }
    .slide-overlay h2 {
      font-family:'Poppins',sans-serif; font-weight:700; font-size:1.7rem;
      color:#333; margin:0 0 8px;
    }
    .slide-overlay p  {
      font-family:'Poppins',sans-serif; font-weight:500; font-size:0.9rem;
      color:#555; line-height:1.5; margin:0;
    }
    .slide.light-text .slide-overlay h2,
    .slide.light-text .slide-overlay p { color: #fff !important; }
    .dots-container {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 4;
    }
    .dot { height: 5px; width: 44px; background: rgba(210,212,218,0.8); border-radius: 20px; cursor: pointer; transition: background 0.3s; }
    .dot.active { background: #959595; }
    .slider-button { display: none; }

    /* ── SKELETON (slide loading placeholder) ── */
    .skeleton {
      background: linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);
      background-size: 600px 100%; animation: shimmer 1.4s infinite linear;
    }

    /* ── ABOUT ── */
    .section-2 {
      max-width: 100%; display: grid; grid-template-columns: 1fr 1.7fr;
      gap: 32px; padding: 36px 28px; width: 100%; align-items: start;
    }
    .image-wrap { position: relative; overflow: hidden; border-radius: 12px; align-self: start; }
    .image-wrap img {
      width: 100%; height: auto; display: block;
      mask-image: linear-gradient(to right, black 65%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 65%, transparent 100%);
    }
    .content-2 { display: flex; flex-direction: column; padding-top: 20px; }
    .content-2 h2 { font-size: 26px; font-weight: 600; margin-bottom: 10px; }
    .content-2 p  { font-size: 15px; line-height: 1.6; margin-bottom: 10px; color: #444; }
    .skills { margin-top: 10px; }
    .skills h3 { font-size: 13px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skills-list span { background: #f1f1f1; color: #333; padding: 5px 11px; border-radius: 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
    .skills-list span img { height: 15px; width: auto; }

    /* ── ICON CARD SLIDER ── */
    .card { max-width:100%; width: 100%; border-radius: 12px; padding: 40px 20px; text-align: center; }
    .products { position: relative; overflow: hidden; height: 180px; display:flex; justify-content:center; align-items:center; }
    .product { position: absolute; top:0; left:0; width:100%; opacity:0; visibility:hidden; transition:opacity 0.5s; display:flex; justify-content:center; align-items:center; height:100%; }
    .product.active { opacity:1; visibility:visible; }
    .thumbnail { width:100%; display:flex; justify-content:center; align-items:center; }
    .thumbnail img { max-width:250px; height:200px; object-fit:contain; display:block; margin:0 auto; }
    .footer { display:flex; justify-content:space-evenly; align-items:center; gap:0; margin-top:12px; width:100%; }
    .footer .btn { flex:0 0 auto; min-width:80px; text-align:center; }
    .btn { text-decoration:none; text-transform:uppercase; font-weight:bold; padding:9px 14px; border-radius:4px; color:#7c0a02; position:relative; overflow:hidden; cursor:pointer; background:transparent; border:none; font-family:inherit; transition:color 0.2s; }

    /* ── TESTIMONIALS ── */
    .testimonials-container { max-width:100%; border-radius:12px; padding:24px 28px; width:100%; }
    .testimonials-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .testimonials-title { font-size:24px; font-weight:700; color:#1a1a1a; letter-spacing:-0.02em; }
    .navigation-arrows { display:flex; gap:24px; }
    .nav-arrow { width:34px; height:34px; border-radius:50%; border:2px solid #7c0a02; background:#d1ccc5; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s; position:relative; }
    .nav-arrow:hover { background:#7c0a02; transform:translateY(-2px); }
    .nav-arrow::before { content:''; width:10px; height:10px; border:2px solid #7c0a02; border-bottom:none; border-right:none; transition:border-color 0.3s; }
    .nav-arrow:hover::before { border-color:#fff; }
    .nav-arrow.prev::before { transform:rotate(-45deg); margin-left:3px; }
    .nav-arrow.next::before { transform:rotate(135deg); margin-right:3px; }
    .nav-arrow.disabled { opacity:0.3; cursor:not-allowed; }
    .nav-arrow.disabled:hover { background:#d1ccc5; transform:none; }
    .testimonials-content { position:relative; overflow:hidden; min-height:80px; }
    .testimonials-slider { position:relative; width:100%; }
    .testimonial-slide { position:absolute; top:0; left:0; width:100%; opacity:0; visibility:hidden; transition:opacity 0.5s,visibility 0.5s; }
    .testimonial-slide.active { opacity:1; visibility:visible; position:relative; }
    .testimonial-text { font-size:15px; line-height:1.6; color:#2c2c2c; margin-bottom:14px; }
    .testimonial-author { font-size:13px; color:#7c0a02; font-style:italic; }
    @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
    .testimonial-slide.entering { animation:slideIn 0.4s ease forwards; }

    /* ── ENTER ANIMATIONS ── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
    .grid-wrapper .tall,
    .grid-wrapper .box,
    .grid-wrapper .big,
    .grid-wrapper .big-2,
    .grid-wrapper .wide2,
    .grid-wrapper .wide { opacity:0; }
    .show-initial.tall  { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.1s forwards; }
    .show-initial.wide2 { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.2s forwards; }
    .show-initial.box   { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.35s forwards; }
    .show-initial.big   { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.25s forwards; }
    .show-initial.big-2 { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.3s forwards; }
    .show-initial.wide  { animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.2s forwards; }

    /* ── SCROLL ANIMATIONS ── */
    /* Cards hidden offscreen until they scroll into view */
    .scroll-from-left  { opacity:0; transform:translateX(-80px); }
    .scroll-from-right { opacity:0; transform:translateX(80px);  }

    /* Dynamic cards start hidden */
    .dyn-card { opacity:0; }

    /* Smooth fade-in when Firebase text replaces skeletons */
    .text-loaded {
      animation: textFadeIn 0.5s ease forwards;
    }
    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* Smooth transition for all scroll-animated cards */
    .scroll-anim {
      transition: opacity 0.65s cubic-bezier(.4,0,.2,1),
                  transform 0.65s cubic-bezier(.4,0,.2,1);
      will-change: opacity, transform;
    }

    /* Visible state — snaps into place */
    .scroll-anim.in-view {
      opacity: 1 !important;
      transform: translateX(0) !important;
    }

    /* Mobile: reduce slide distance */
    @media (max-width:768px) {
      .scroll-from-left  { transform:translateX(-50px); }
      .scroll-from-right { transform:translateX(50px);  }
    }

    /* ── TABLET ── */
    @media (max-width:1024px) {
      .grid-wrapper { grid-template-columns:repeat(2,1fr); gap:14px; }
      .grid-wrapper .big-2, .grid-wrapper .slim { grid-column:span 2; }
    }

    /* ── MOBILE ── */
    @media (max-width:768px) {
      html, body { padding:8px; }
      .grid-wrapper {
        grid-template-columns:1fr; gap:15px; grid-auto-rows:auto;
      }
      .grid-wrapper > div { border-radius:16px !important; }
      .grid-wrapper .wide,
      .grid-wrapper .wide2,
      .grid-wrapper .big,
      .grid-wrapper .big-2,
      .grid-wrapper .slim,
      .grid-wrapper .tall { grid-column:span 1; grid-row:span 1; }

      .grid-wrapper .tall  { height:550px; min-height:500px; }
      .grid-wrapper .big   { height:350px; min-height:350px; }
      .grid-wrapper .wide  { min-height:270px; }
      .grid-wrapper .wide2 { height:350px; min-height:350px; }
      .grid-wrapper .box   { min-height:250px; }
      .grid-wrapper .big-2 { min-height:auto; }
      .grid-wrapper .slim  { min-height:140px; }
      .social-heading { font-size: 15px; color: #000; margin-bottom: 14px; }
      /* Slider chain must all be 350px so image fills card, never the reverse */
      .grid-wrapper .big,
      .grid-wrapper .big .slider-wrapper,
      .grid-wrapper .big .slider-container,
      .grid-wrapper .big .slider-track,
      .grid-wrapper .big .slide { height:450px !important; }

      /* Dynamic card sliders — same fix */
      .dyn-card .slider-wrapper,
      .dyn-card .slider-container,
      .dyn-card .slider-track,
      .dyn-card .slide { height:350px !important; }

      .section-2 { grid-template-columns:1fr; padding:16px; gap:12px; }
      .image-wrap img {
        height:200px; object-fit:cover;
        mask-image:linear-gradient(to bottom,black 75%,transparent 100%);
        -webkit-mask-image:linear-gradient(to bottom,black 75%,transparent 100%);
      }
      .content-2 { padding-top:4px; }
      .content-2 h2 { font-size:20px; }
      .content-2 p  { font-size:14px; }

      .content { padding:30px; }
      .content h2 { font-size:1.5rem; }
      .content p  { font-size:0.87rem; }

      .slide-overlay { top:12px; left:12px; max-width:200px; padding:8px; }
      .slide-overlay h2 { font-size:1.2rem; }
      .slide-overlay p  { font-size:0.8rem; }

      .social-icons { gap:40px; padding:20px; }
      .social-icons a { font-size:40px; }
      .social-icons-2 { gap:24px; padding:14px 16px 20px; }
      .social-icons-2 a { font-size:26px; }

      .card { padding:20px 14px; max-width:100%; }
      .products { height:140px; }
      .thumbnail img { height:200px; }
      .footer { gap:0; justify-content:space-evenly; }

      .testimonials-container { padding:16px 18px; }
      .testimonials-title { font-size:20px; }
      .testimonial-text { font-size:14px; }

      .dot { width:30px; }
      .resume-btn { font-size:12px; padding:10px 10px; }
    }

    @media (max-width:420px) {
      .content h2 { font-size:1.3rem; }
      .slide-overlay h2 { font-size:1.05rem; }
      .slide-overlay p  { font-size:0.75rem; }
      .social-icons { grid-template-columns:repeat(2,1fr); gap:40px; padding:12px; }
      .social-icons a { font-size:40px; }
    }

    /* ── SCROLL TO TOP ── */
    #scrollTopBtn {
      position:fixed; bottom:28px; right:24px; z-index:999;
      width:44px; height:44px; border-radius:50%;
      background:#7c0a02; color:#fff; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; box-shadow:0 4px 16px rgba(124,10,2,0.4);
      opacity:0; transform:translateY(20px) scale(0.8);
      transition:opacity .3s, transform .3s;
      pointer-events:none;
    }
    #scrollTopBtn.visible {
      opacity:1; transform:translateY(0) scale(1);
      pointer-events:auto;
    }
    #scrollTopBtn:hover { background:#c41b0f; transform:scale(1.1); }
    #scrollTopBtn:active { transform:scale(0.95); }

/* view counter removed */

/* contact modal/fab removed */

    /* ── TESTIMONIAL SWIPE TARGETS (larger touch area) ── */
    .nav-arrow { min-width:44px; min-height:44px; }

    /* ── SKELETON LOADING ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skel {
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
      display: inline-block;
    }
    /* Skeleton line helpers */
    .skel-h1  { height: 28px; width: 60%; margin-bottom: 10px; }
    .skel-h2  { height: 22px; width: 75%; margin-bottom: 8px;  }
    .skel-p   { height: 14px; width: 90%; margin-bottom: 6px;  }
    .skel-p2  { height: 14px; width: 70%; margin-bottom: 0;    }
    .skel-icon{ width: 36px;  height: 36px; border-radius: 50%; }
    /* Loading STATE */
    /* ── LOADING STATE ── */
    .skeleton-msg {
      position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
      font-size:11px; color:#aaa; font-family:'Inter',sans-serif;
      white-space:nowrap; animation:fadeMsg 3s ease 2s forwards;
      opacity:0;
    }
    @keyframes fadeMsg { 0%{opacity:0} 20%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
    .skeleton-error {
      display:none; width:100%; height:100%;
      align-items:center; justify-content:center; flex-direction:column;
      gap:10px; color:#aaa; font-family:'Inter',sans-serif; font-size:13px;
      text-align:center; padding:20px; background:#f8f8f8; border-radius:15px;
    }
    .skeleton-error.show { display:flex; }
    .skeleton-error i { font-size:28px; color:#ddd; }
    </style>
</head>
<body>
<div class="grid-wrapper">

  <!-- ① DEVOPS HERO -->
  <div class="tall" style="background-color:#2a3036;border-radius:20px;">
    <img src="./images/octo.png" alt="" id="heroImg" loading="eager">
    <div class="content" style="top:0;">
      <h2 id="heroTitle" style="color:#edeef0;"><span class="skel skel-h1" style="background:linear-gradient(90deg,rgba(255,255,255,.15) 25%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.15) 75%);background-size:600px 100%;animation:shimmer 1.4s infinite linear;"></span></h2>
      <p id="heroSubtitle" style="color:aliceblue;"><span class="skel skel-p" style="background:linear-gradient(90deg,rgba(255,255,255,.1) 25%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.1) 75%);background-size:600px 100%;animation:shimmer 1.4s infinite linear;width:80%;"></span></p>
    </div>
    <!-- Secret admin trigger: 5 taps to open admin login -->
    <span class="admin-trigger" id="adminTrigger" title="">
      <i class="fas fa-user-shield"></i>
    </span>
    <a id="resumeBtn" class="resume-btn" href="#" download>
      <i class="fas fa-file-alt"></i> Here’s My Story
    </a>
  </div>

  <!-- ② QUOTE/GITHUB -->
  <div class="wide2" style="border-radius:20px;background-color:#800000;position:relative;overflow:hidden;color:white;">

document.addEventListener('DOMContentLoaded', () => {

  /* ── STEP 1: Initial load animation (first visible row — fadeUp) ── */
  const allCards = Array.from(document.querySelectorAll(
    '.grid-wrapper .tall, .grid-wrapper .box, .grid-wrapper .big, ' +
    '.grid-wrapper .wide2, .grid-wrapper .wide, .grid-wrapper .big-2'
  ));

  // Determine which cards are in the initial viewport
  const viewH = window.innerHeight;
  const initialCards = allCards.filter(el => {
    const r = el.getBoundingClientRect();
    return r.top < viewH + 60; // small buffer
  });
  const scrollCards = allCards.filter(el => !initialCards.includes(el));

  // Trigger fadeUp for initial cards
  setTimeout(() => {
    initialCards.forEach(el => el.classList.add('show-initial'));
  }, 80);

  /* ── STEP 2: Assign scroll direction to below-fold cards ──
     4-column grid: columns 1-2 = from left, columns 3-4 = from right
     On mobile (1 column): alternate left/right by row index            */
  function assignScrollDirection() {
    const isMobile = window.innerWidth <= 768;
    let scrollIdx = 0;
    scrollCards.forEach(el => {
      el.classList.add('scroll-anim');
      if (isMobile) {
        // Alternate left/right on mobile
        el.classList.add(scrollIdx % 2 === 0 ? 'scroll-from-left' : 'scroll-from-right');
      } else {
        // Use grid column position
        const col = getGridColumn(el);
        el.classList.add(col <= 2 ? 'scroll-from-left' : 'scroll-from-right');
      }
      scrollIdx++;
    });
  }

  function getGridColumn(el) {
    // Read computed grid column from the element's position relative to parent
    const parent = el.parentElement;
    const parentLeft = parent.getBoundingClientRect().left;
    const elLeft = el.getBoundingClientRect().left;
    const colWidth = parent.offsetWidth / 4;
    return Math.round((elLeft - parentLeft) / colWidth) + 1;
  }

  assignScrollDirection();

  /* ── STEP 3: IntersectionObserver — in/out of view ── */
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;
      if (entry.isIntersecting) {
        const delay = el.dataset.scrollDelay || 0;
        setTimeout(() => el.classList.add('in-view'), delay);
        observer.unobserve(el); // once animated, never revert
      }
    });
  }, {
    threshold: 0.12,   // trigger when 12% of card is visible
    rootMargin: '0px 0px -40px 0px' // slight offset from bottom edge
  });

  // Stagger delay for cards that appear in the same "row"
  let prevTop = -1, rowIdx = 0, rowCount = 0;
  scrollCards.forEach(el => {
    const top = Math.round(el.getBoundingClientRect().top);
    if (Math.abs(top - prevTop) > 20) { rowIdx++; rowCount = 0; } // new row
    el.dataset.scrollDelay = rowCount * 80; // 80ms stagger per card in same row
    rowCount++;
    prevTop = top;
    observer.observe(el);
  });

  /* ── STEP 4: Smooth scroll behaviour ── */
  document.documentElement.style.scrollBehavior = 'smooth';

  /* ── STEP 5: Re-assign on resize (mobile ↔ desktop) ── */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      scrollCards.forEach(el => {
        el.classList.remove('scroll-from-left','scroll-from-right','in-view');
      });
      assignScrollDirection();
      // Re-observe
      scrollCards.forEach(el => observer.observe(el));
    }, 200);
  });

  /* ── STEP 6: Expose helper for dynamically injected cards (card builder) ── */
  window.applyScrollAnim = function(elements) {
    if (!elements || !elements.length) return;
    const isMobile = window.innerWidth <= 768;
    elements.forEach((el, idx) => {
      // Skip if already animated
      if (el.classList.contains('scroll-anim')) return;
      // Start hidden offscreen
      el.style.opacity = '0';
      el.classList.add('scroll-anim');
      // Determine direction
      if (isMobile) {
        el.classList.add(idx % 2 === 0 ? 'scroll-from-left' : 'scroll-from-right');
      } else {
        // Use horizontal position relative to viewport midpoint
        const rect = el.getBoundingClientRect();
        const mid  = window.innerWidth / 2;
        el.classList.add(rect.left < mid ? 'scroll-from-left' : 'scroll-from-right');
      }
      // Small stagger per card
      el.dataset.scrollDelay = idx * 80;
      // Observe
      observer.observe(el);
    });
  };

});

/* ── SLIDER FACTORY ── */
function initSlider(containerId) {
  setTimeout(() => {
    const container = document.getElementById(containerId);
    if (!container) return;
    const track = container.querySelector('.slider-track');
    const dotsWrap = container.querySelector('.dots-container');
    if (!track || !dotsWrap) return;
    const slides = track.querySelectorAll('.slide');
    if (!slides.length) return;
    let cur = 0;

    dotsWrap.innerHTML = '';
    slides.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i===0?' active':'');
      d.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(d);
    });

    function goTo(n) {
      cur = ((n % slides.length) + slides.length) % slides.length;
      track.style.transform = `translateX(-${cur*100}%)`;
      dotsWrap.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===cur));
    }

    // touch swipe
    let tx=0, ty=0, dragging=false, dx=0;
    container.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; dragging=false; dx=0; }, {passive:true});
    container.addEventListener('touchmove', e => {
      dx = tx - e.touches[0].clientX;
      const dy = ty - e.touches[0].clientY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) { dragging=true; e.preventDefault(); }
    }, {passive:false});
    container.addEventListener('touchend', () => { if (dragging && Math.abs(dx)>40) goTo(cur+(dx>0?1:-1)); dragging=false; }, {passive:true});

    // click nav desktop
    container.addEventListener('click', e => {
      if (window.innerWidth <= 768) return;
      if (e.target.classList.contains('dot')) return;
      const rect = container.getBoundingClientRect();
      goTo(cur + (e.clientX - rect.left < rect.width/2 ? -1 : 1));
    });
    goTo(0);
  }, 30);
}

/* ── ICON CARD SLIDER FACTORY ── */
function initIconSlider(cardId) {
  setTimeout(() => {
    const card = document.getElementById(cardId);
    if (!card) return;
    const products = card.querySelectorAll('.product');
    const prodWrap = card.querySelector('.products');
    const prevBtn = card.querySelector('.btn.prev');
    const nextBtn = card.querySelector('.btn.next');
    if (!products.length) return;
    let cur = 0;

    const newPrev = prevBtn.cloneNode(true);
    const newNext = nextBtn.cloneNode(true);
    prevBtn.replaceWith(newPrev);
    nextBtn.replaceWith(newNext);

    function update() {
      products.forEach(p => p.classList.remove('active'));
      products[cur].classList.add('active');
      if (prodWrap) prodWrap.style.height = products[cur].offsetHeight + 'px';
    }
    newPrev.addEventListener('click', e => { e.preventDefault(); cur=(cur-1+products.length)%products.length; update(); });
    newNext.addEventListener('click', e => { e.preventDefault(); cur=(cur+1)%products.length; update(); });
    update();
  }, 50);
}

  }

  /* ── AI Slides ── */
  onSnapshot(query(collection(db,'ai-slides'), orderBy('order')), snap =>
    setSlider('aiSliderTrack','aiSliderContainer', snap.docs));

  /* ── DevOps Slides ── */
  onSnapshot(query(collection(db,'devops-slides'), orderBy('order')), snap =>
    setSlider('devopsSliderTrack','devopsSliderContainer', snap.docs));

  /* ── UI Slides ── */
  onSnapshot(query(collection(db,'ui-slides'), orderBy('order')), snap =>
    setSlider('uiSliderTrack','uiSliderContainer', snap.docs));

  /* ── Projects ── */
  onSnapshot(query(collection(db,'projects'), orderBy('order')), snap => {
    const slider = document.getElementById('projectsSlider');
    if (!slider) return;
    slider.innerHTML = snap.empty
      ? `<div class="testimonial-slide active"><p class="testimonial-text" style="color:#aaa;font-style:italic">No projects yet.</p><p class="testimonial-author"></p></div>`
      : snap.docs.map((d,i) => {
          const item = d.data();
          return `<div class="testimonial-slide${i===0?' active':''}">
            <p class="testimonial-text">${item.description||''}</p>
            <p class="testimonial-author">${item.name||''}</p>
          </div>`;
        }).join('');
    if (typeof window.reinitTestimonials==='function') window.reinitTestimonials();
  });

  /* ── DevOps Skills (icon slider 1) ── */
  onSnapshot(query(collection(db,'devops-skills'), orderBy('order')), snap =>
    setIconSlider('devopsIconSlider','devopsIconProducts', snap.docs));

  /* ── Frontend Skills (icon slider 2) ── */
  onSnapshot(query(collection(db,'frontend-skills'), orderBy('order')), snap =>
    setIconSlider('frontendIconSlider','frontendIconProducts', snap.docs));

  /* ── About Skills tag cloud ── */
  onSnapshot(query(collection(db,'skills'), orderBy('order')), snap => {
    const list = document.getElementById('skillsList');
    if (!list) return;
    list.innerHTML = snap.empty
      ? '<span style="color:#ccc;font-style:italic;background:transparent;">No skills yet</span>'
      : snap.docs.map(d => {
          const item = d.data();
          const src = cldOpt(item.iconUrl||'', {width:60});
          return item.iconUrl
            ? `<span><img src="${src}" alt="${item.name||''}" loading="lazy">${item.name||''}</span>`
            : `<span>${item.name||''}</span>`;
        }).join('');
  });

  /* ── Resume ── */
  onSnapshot(doc(db,'site-settings','resume'), snap => {
    const btn = document.getElementById('resumeBtn');
    if (!btn) return;
    if (snap.exists() && snap.data().url) {
      btn.href = snap.data().url;
      btn.target = '_blank';
      btn.removeAttribute('download');
      btn.style.display = 'flex';
    } else {
      btn.style.display = 'none';
    }
  });

  /* ── Profile Image ── */
  onSnapshot(doc(db,'site-settings','profile'), snap => {
    if (!snap.exists()) return;
    const url = cldOpt(snap.data().photoUrl||'', {width:600});
    if (!url) return;
    const img = document.getElementById('profilePhoto');
    if (img) img.src = url;
  });

  /* ── Dynamic Page Cards ── */
  onSnapshot(query(collection(db,'page-cards'), orderBy('order')), snap => {
    const zone = document.getElementById('dynamicCardsZone');
    if (!zone) return;
    zone.innerHTML = '';
    snap.docs.forEach(d => {
      const card = {id: d.id, ...d.data()};
      const el = buildDynamicCard(card);
      if (el) zone.appendChild(el);
    });
    // init any new sliders/icon-sliders inside dynamic zone
    zone.querySelectorAll('[data-slider-id]').forEach(c => initSlider(c.id));
    zone.querySelectorAll('[data-icon-slider-id]').forEach(c => initIconSlider(c.id));
    // Apply scroll animations to all dynamic cards
    // Small delay so elements are fully in the DOM and positioned
    setTimeout(() => {
      const dynCards = Array.from(zone.querySelectorAll('.dyn-card'));
      if (typeof window.applyScrollAnim === 'function') {
        window.applyScrollAnim(dynCards);
      } else {
        // Fallback if scroll system not ready yet — use simple fadeUp
        dynCards.forEach(c => c.classList.add('show-initial'));
      }
    }, 120);
  });

  function buildDynamicCard(card) {
    const cfg = card.config || {};
    const sizeClass = card.size || 'wide2';
    const bg = cfg.bgColor || '#ffffff';
    const br = 'border-radius:20px;overflow:hidden;';

    let inner = '';

    if (card.type === 'text-icon') {
      inner = `<div class="content" style="top:0;padding:28px;">
        <h2 style="color:${cfg.titleColor||'#333'}">${cfg.title||''}</h2>
        <p style="color:${cfg.textColor||'#555'}">${cfg.body||''}</p>
      </div>`;
    }
    else if (card.type === 'quote-banner') {
      inner = `<div class="content" style="bottom:0;top:auto;padding:2rem;width:100%;">
        <h2 style="color:${cfg.titleColor||'#fff'}">${cfg.title||''}</h2>
        ${cfg.link ? `<p style="margin-top:8px"><a href="${cfg.link}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square" style="color:${cfg.titleColor||'#fff'};font-size:18px"></i></a></p>` : ''}
      </div>
      ${cfg.bgImage ? `<img src="${cldOpt(cfg.bgImage,{width:800})}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:0;opacity:0.4" loading="lazy">` : ''}`;
    }
    else if (card.type === 'skills-cloud') {
      const items = (cfg.skills || []).map(s =>
        s.iconUrl ? `<span style="display:inline-flex;align-items:center;gap:5px;background:#f1f1f1;color:#333;padding:5px 11px;border-radius:10px;font-size:13px"><img src="${cldOpt(s.iconUrl,{width:60})}" style="height:15px;width:auto" loading="lazy">${s.name}</span>`
                  : `<span style="background:#f1f1f1;color:#333;padding:5px 11px;border-radius:10px;font-size:13px">${s.name}</span>`
      ).join('');
      inner = `<div style="padding:28px;width:100%">
        ${cfg.title ? `<h3 style="font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;color:${cfg.titleColor||'#333'}">${cfg.title}</h3>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:8px">${items||'<span style="color:#aaa;font-size:13px">No skills yet</span>'}</div>
      </div>`;
    }
    else if (card.type === 'image-slider') {
      const sliderId = 'dyn-slider-' + card.id;
      const trackId  = 'dyn-track-' + card.id;
      const slides   = (cfg.slides || []).map(s => {
        const cls   = s.textColor==='light' ? 'slide light-text' : 'slide';
        const align = s.textAlign || 'left';
        const src   = cldOpt(s.imgUrl||'', {width:1200});
        return `<div class="${cls}">
          <img src="${src}" alt="" ${s.bgColor?`style="background-color:${s.bgColor}"`:''}  loading="lazy">
          <div class="slide-overlay" style="text-align:${align}">
            <h2 style="text-align:${align}">${s.title||''}</h2>
            <p style="text-align:${align}">${s.description||''}</p>
          </div>
        </div>`;
      }).join('') || `<div class="slide" style="background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px">No slides yet</div>`;
      inner = `<div class="slider-wrapper" style="width:100%;height:100%">
        <div class="slider-container" id="${sliderId}">
          <div class="slider-track" id="${trackId}">${slides}</div>
          <div class="dots-container"></div>
        </div>
      </div>`;
      setTimeout(() => initSlider(sliderId), 100);
    }
    else if (card.type === 'icon-slider') {
      const cardId  = 'dyn-icon-' + card.id;
      const prodsId = 'dyn-prods-' + card.id;
      const icons   = (cfg.icons || []).map(ic => {
        const src = cldOpt(ic.iconUrl||'', {width:200, fit:'fill'});
        return `<div class="product"><div class="thumbnail" style="display:flex;justify-content:center;align-items:center;width:100%;height:100%">${
          ic.iconUrl
            ? `<img src="${src}" alt="${ic.name||''}" loading="lazy" style="max-height:130px;max-width:180px;object-fit:contain;">`
            : `<div style="width:120px;height:100px;background:#f1f1f1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666;text-align:center;padding:8px">${ic.name||''}</div>`
        }</div></div>`;
      }).join('') || `<div class="product active"><div class="thumbnail" style="color:#aaa;font-size:13px;text-align:center">No icons</div></div>`;
      inner = `<div style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px">
        <div class="products" id="${prodsId}" style="position:relative;overflow:hidden;height:180px;width:100%;max-width:300px">${icons}</div>
        <div style="display:flex;justify-content:space-between;width:100%;max-width:300px;margin-top:12px">
          <button class="btn prev" style="flex:1;text-align:center">Prev</button>
          <button class="btn next" style="flex:1;text-align:center">Next</button>
        </div>
      </div>`;
      // Use a wrapper div with a unique id for initIconSlider
      const wrapId = 'dyn-icon-wrap-' + card.id;
      inner = `<div id="${wrapId}" style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px">
        <div class="products" id="${prodsId}" style="position:relative;overflow:hidden;height:180px;width:100%;max-width:320px">${icons}</div>
        <div class="footer" style="width:100%;max-width:320px">
          <button class="btn prev">Prev</button>
          <button class="btn next">Next</button>
        </div>
      </div>`;
      setTimeout(() => initIconSlider(wrapId), 100);
    }
    else if (card.type === 'project-testimonial') {
      const items = cfg.items || [];
      const slidesHtml = items.map((it, i) =>
        `<div class="testimonial-slide${i===0?' active':''}">
          <p class="testimonial-text">${it.description||''}</p>
          <p class="testimonial-author">${it.name||''}</p>
        </div>`).join('') || `<div class="testimonial-slide active"><p class="testimonial-text" style="color:#aaa;font-style:italic">No projects yet.</p><p class="testimonial-author"></p></div>`;
      const sliderId = 'dyn-proj-' + card.id;
      inner = `<div class="testimonials-container" style="width:100%">
        <div class="testimonials-header">
          <h2 class="testimonials-title" style="color:${cfg.titleColor||'#1a1a1a'}">${cfg.title||'Projects'}</h2>
          <div class="navigation-arrows">
            <button class="nav-arrow prev" onclick="dynPrev('${sliderId}')"></button>
            <button class="nav-arrow next" onclick="dynNext('${sliderId}')"></button>
          </div>
        </div>
        <div class="testimonials-content">
          <div class="testimonials-slider" id="${sliderId}">${slidesHtml}</div>
        </div>
      </div>`;
      setTimeout(() => initDynTestimonials(sliderId), 100);
    }
    else return null;

    const wrapper = document.createElement('div');
    wrapper.className = `${sizeClass} dyn-card`;
    wrapper.style.cssText = `background:${bg};${br}`;
    wrapper.setAttribute('data-card-id', card.id);
    wrapper.innerHTML = inner;
    return wrapper;
  }

  // mini testimonial manager for dynamic project cards
  const dynStates = {};
  function initDynTestimonials(sliderId) {
    dynStates[sliderId] = 0;
    updateDynSlide(sliderId);
  }
  function updateDynSlide(sliderId) {
    const container = document.getElementById(sliderId);
    if (!container) return;
    const slides = container.querySelectorAll('.testimonial-slide');
    const idx = dynStates[sliderId] || 0;
    slides.forEach((s,i) => { s.classList.remove('active','entering'); if(i===idx){s.classList.add('active');setTimeout(()=>s.classList.add('entering'),10);} });
  }
  window.dynPrev = (id) => { const s=document.getElementById(id); if(!s) return; const len=s.querySelectorAll('.testimonial-slide').length; dynStates[id]=Math.max(0,(dynStates[id]||0)-1); updateDynSlide(id); };
  window.dynNext = (id) => { const s=document.getElementById(id); if(!s) return; const len=s.querySelectorAll('.testimonial-slide').length; dynStates[id]=Math.min(len-1,(dynStates[id]||0)+1); updateDynSlide(id); };
  // helper — clears skeletons then fades in real content
  function setText(el, html, isHTML=false) {
    if (!el) return;
    el.querySelectorAll('.skel').forEach(s=>s.remove());
    if (isHTML) el.innerHTML = html; else el.textContent = html;
    // smooth fade-in — reset then re-trigger
    el.classList.remove('text-loaded');
    void el.offsetWidth; // force reflow
    el.classList.add('text-loaded');
  }

  /* ── Site Text: load ALL text sections in ONE parallel batch ──
     getDoc (one-shot) instead of onSnapshot (persistent WebSocket)
     All 5 docs fetched simultaneously → renders as soon as Firebase responds  */
  Promise.all([
    getDoc(doc(db,'site-settings','text-hero')),
    getDoc(doc(db,'site-settings','text-quote')),
    getDoc(doc(db,'site-settings','text-hello')),
    getDoc(doc(db,'site-settings','text-about')),
    getDoc(doc(db,'site-settings','text-social')),
  ]).then(([heroSnap, quoteSnap, helloSnap, aboutSnap, socialSnap]) => {

    /* Hero */
    if (heroSnap.exists()) {
      const d = heroSnap.data();
      const hero = document.querySelector('.tall');
      if (d.heroTitle)    setText(document.getElementById('heroTitle'),    d.heroTitle);
      if (d.heroSubtitle) setText(document.getElementById('heroSubtitle'), d.heroSubtitle);
      if (d.heroBg && hero) hero.style.backgroundColor = d.heroBg;
    }

    /* Quote */
    if (quoteSnap.exists()) {
      const d = quoteSnap.data();
      if (d.quoteTitle) setText(document.getElementById('quoteText'), d.quoteTitle, true);
      if (d.quoteLink)  { const a=document.getElementById('quoteGithubLink'); if(a) a.href=d.quoteLink; }
      const qCard = document.querySelectorAll('.wide2')[0];
      if (d.quoteBg && qCard) qCard.style.backgroundColor = d.quoteBg;
    }

    /* Hello */
    if (helloSnap.exists()) {
      const d = helloSnap.data();
      if (d.helloTitle) setText(document.getElementById('helloTitle'), d.helloTitle);
      if (d.helloText)  setText(document.getElementById('helloSub'),   d.helloText);
    }

    /* About */
    if (aboutSnap.exists()) {
      const d = aboutSnap.data();
      const aboutCard = document.querySelector('.big-2');
      if (d.aboutTitle) setText(document.getElementById('aboutHeading'), d.aboutTitle);
      if (d.aboutP1) {
        const el = document.getElementById('aboutDesc1');
        if (el) { el.querySelectorAll('.skel').forEach(s=>s.remove()); el.innerHTML='<span style="color:beige">I\'m Ashish Sharma — </span>'+d.aboutP1; el.classList.remove('text-loaded'); void el.offsetWidth; el.classList.add('text-loaded'); }
      }
      if (d.aboutP2) setText(document.getElementById('aboutDesc2'), d.aboutP2);
      if (d.aboutBg && aboutCard) aboutCard.style.backgroundColor = d.aboutBg;
      const sh = document.getElementById('skillsHeading');
      if (sh) setText(sh, d.skillsHeading || 'Skills');
      const pt = document.getElementById('projectsTitle');
      if (pt) setText(pt, d.projectsTitle || 'What I Built');
    }

    /* Social */
    if (socialSnap.exists()) {
      const d = socialSnap.data();
      const box = document.getElementById('socialIconsBox');
      if (box) {
        box.innerHTML = `
          ${d.email    ? `<a href="mailto:${d.email}"   aria-label="Email"><i class="fas fa-envelope"></i></a>`   : ''}
          ${d.github   ? `<a href="${d.github}" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>` : ''}
          ${d.phone    ? `<a href="tel:${d.phone}"      aria-label="Phone"><i class="fas fa-phone"></i></a>`     : ''}
          ${d.linkedin ? `<a href="${d.linkedin}" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>` : ''}
        `;
        box.classList.remove('text-loaded'); void box.offsetWidth; box.classList.add('text-loaded');
      }
      if (d.email)   { const a=document.getElementById('footerEmail');   if(a) a.href='mailto:'+d.email; }
      if (d.github)  { const a=document.getElementById('footerGithub');  if(a) a.href=d.github; }
      if (d.phone)   { const a=document.getElementById('footerPhone');   if(a) a.href='tel:'+d.phone; }
      if (d.linkedin){ const a=document.getElementById('footerLinkedin');if(a) a.href=d.linkedin; }
      if (d.footerText) setText(document.getElementById('footerTagline'), d.footerText, true);
    }

  }).catch(e => console.warn('[Portfolio] Text load error:', e.message));


} catch(e) { console.error('[Portfolio] Firebase error:', e.message); }
</script>
</body>
</html>
